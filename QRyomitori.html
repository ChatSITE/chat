<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>QRコード 静止フレーム＆ファイルスキャン</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #videoPreview { border: 2px dashed #888; width: 320px; height: 240px; object-fit: contain; margin-bottom: 10px; }
    canvas { display: none; }
    #result { margin-top: 20px; max-width: 100%; }
    #status { margin: 10px; font-weight: bold; }
    button { margin: 5px; padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>

<h1>QRコード 静止フレーム＆ファイルスキャン</h1>

<p id="status">カメラ起動またはファイルを選択してください</p>

<video id="videoPreview" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div>
  <button id="startBtn">カメラ起動</button>
  <button id="scanBtn" disabled>QRを撮影して解析</button>
  <input type="file" id="fileInput" accept="image/*">
  <button id="finishBtn" disabled>画像復元</button>
</div>

<img id="result" alt="復元画像">

<script>
const video = document.getElementById("videoPreview");
const canvas = document.getElementById("canvas");
const context = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");

let chunks = {};
let total = null;
let cameraStarted = false;

// カメラ起動
document.getElementById("startBtn").addEventListener("click", async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = stream;
    cameraStarted = true;
    statusEl.innerText = "カメラ起動完了。QRを枠内に合わせて「QRを撮影して解析」を押してください。";
    document.getElementById("scanBtn").disabled = false;
  } catch (e) {
    alert("カメラが使えません: " + e.message);
  }
});

// 1枚スキャン（静止フレーム取得）
document.getElementById("scanBtn").addEventListener("click", () => {
  if (!cameraStarted) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  context.drawImage(video, 0, 0, canvas.width, canvas.height);

  scanQRCodeFromCanvas();
});

// ファイルからスキャン
document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    context.drawImage(img, 0, 0);
    scanQRCodeFromCanvas();
  };
  img.src = URL.createObjectURL(file);
});

// QR解析関数
function scanQRCodeFromCanvas() {
  const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
  const qr = jsQR(imageData.data, imageData.width, imageData.height);

  if (qr) {
    try {
      const payload = JSON.parse(qr.data);
      if (!(payload.index in chunks)) {
        chunks[payload.index] = payload.data;
        total = payload.total;
        statusEl.innerText = `スキャン中: ${Object.keys(chunks).length}/${total} 個`;
        document.getElementById("finishBtn").disabled = false;
      } else {
        statusEl.innerText = `すでにスキャン済みのQRです (${payload.index+1})`;
      }
    } catch (e) {
      statusEl.innerText = "QRデータ解析エラー";
      console.error(e);
    }
  } else {
    statusEl.innerText = "QRが認識できませんでした。もう一度試してください。";
  }
}

// 画像復元
document.getElementById("finishBtn").addEventListener("click", () => {
  if (!total || Object.keys(chunks).length !== total) {
    alert(`まだスキャンが完了していません (${Object.keys(chunks).length}/${total})`);
    return;
  }

  let merged = [].concat(...Object.values(chunks));
  let u8 = new Uint8Array(merged);
  let blob = new Blob([u8], {type:"image/jpeg"});
  resultEl.src = URL.createObjectURL(blob);
  statusEl.innerText = "スキャン完了！画像復元成功";
});
</script>

</body>
</html>
